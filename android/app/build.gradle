plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// CI sets these to a datetime-derived build number so Android (and
// Obtainium) can tell each dev build apart and offer it as an update.
// Falls back to fixed values for a plain local build.
def appVersionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "1").toInteger()
def appVersionName = System.getenv("ANDROID_VERSION_NAME") ?: "1.0-dev"

android {
    namespace 'com.pack25mahomet.cal'
    compileSdk 34

    // Fixed debug keystore committed at android/debug.keystore. Without this,
    // Gradle auto-generates a NEW random debug key on any machine/CI runner
    // that doesn't already have one at ~/.android/debug.keystore — since
    // GitHub Actions runners are fresh every run, every build was getting a
    // different signer, and Android refuses to install an "update" signed
    // by a different key (surfaces in Obtainium as a conflict failure).
    signingConfigs {
        debug {
            storeFile file("../debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    defaultConfig {
        applicationId "com.pack25mahomet.cal"
        minSdk 24
        targetSdk 34
        versionCode appVersionCode
        versionName appVersionName
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
