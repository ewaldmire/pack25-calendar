plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.pack25mahomet.cal'
    compileSdk 34

    defaultConfig {
        applicationId "com.pack25mahomet.cal"
        minSdk 24
        targetSdk 34
        // CI sets these to a datetime-derived build number so Android (and
        // Obtainium) can tell each dev build apart and offer it as an update.
        // Falls back to fixed values for a plain local build.
        versionCode (System.getenv("ANDROID_VERSION_CODE") ?: "1").toInteger()
        versionName System.getenv("ANDROID_VERSION_NAME") ?: "1.0-dev"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
